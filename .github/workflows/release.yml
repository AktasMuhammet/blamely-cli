name: Build & Publish Release

# Cross-OS build, then publish the resulting binaries as a release on a
# SEPARATE PUBLIC repository (this source repo is private).
#
# How it triggers:
#   - Push a tag of the form `vX.Y.Z` to this private source repo.
#   - Or kick off manually via the "Run workflow" button (workflow_dispatch).
#
# Required secrets in this private source repo:
#   RELEASE_REPO        e.g. `blamely/blamely`           (owner/repo of the PUBLIC release repo)
#   RELEASE_REPO_TOKEN  a fine-grained PAT with `contents: write` on RELEASE_REPO
#                       (default GITHUB_TOKEN can't reach other repos)
#
# Optional secrets:
#   APPLE_CERT_*  / WINDOWS_CERT_*  → code signing if/when you set it up
#
# Artifacts published per semver tag (e.g. v0.2.0):
#   blamely_<tag>_darwin_amd64.tar.gz
#   blamely_<tag>_darwin_arm64.tar.gz
#   blamely_<tag>_linux_amd64.tar.gz
#   blamely_<tag>_linux_arm64.tar.gz
#   blamely_<tag>_windows_amd64.zip
#   blamely_<tag>_windows_arm64.zip
#   SHA256SUMS  (over every versioned archive)
#
# A rolling `latest` release is also updated (stable filenames for installers):
#   blamely_darwin_amd64.tar.gz
#   blamely_darwin_arm64.tar.gz
#   blamely_linux_amd64.tar.gz
#   blamely_linux_arm64.tar.gz
#   blamely_windows_amd64.zip
#   blamely_windows_arm64.zip
#   → https://github.com/<RELEASE_REPO>/releases/download/latest/<asset>

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Required when running manually.'
        required: true
        type: string

permissions:
  contents: read     # only need to read this source repo; release writes go via PAT

env:
  GO_VERSION: '1.26.3'

jobs:
  # ── 1. Build per OS/arch in parallel ───────────────────────────────────────
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64, runner: macos-latest,   ext: ''     }
          - { goos: darwin,  goarch: arm64, runner: macos-latest,   ext: ''     }
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest,  ext: ''     }
          - { goos: linux,   goarch: arm64, runner: ubuntu-latest,  ext: ''     }
          - { goos: windows, goarch: amd64, runner: windows-latest, ext: '.exe' }
          - { goos: windows, goarch: arm64, runner: windows-latest, ext: '.exe' }
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install garble (binary obfuscator)
        # garble wraps `go build` to:
        #   - rename packages, functions, types, fields, and locals to short
        #     non-meaningful names in the compiled binary
        #   - encrypt string literals (decrypted at runtime)
        #   - strip extra runtime metadata
        # Source in this private repo stays unchanged; only the published
        # binary going to the public release repo is obfuscated.
        shell: bash
        run: |
          go install mvdan.cc/garble@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          # Use the pushed tag, or the manual input. Strip refs/tags/ if present.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        run: go test ./...

      - name: Build obfuscated binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'      # static binary; SQLite uses modernc.org/sqlite (pure Go)
          # GOGARBLE controls which import-path patterns get obfuscated. "*"
          # garbles everything including third-party deps (cobra, fsnotify,
          # BurntSushi/toml, modernc.org/sqlite, …). The Go stdlib is never
          # obfuscated. Drop to e.g. "github.com/blamely/*" if a dep mis-
          # behaves under obfuscation (rare for these libs).
          GOGARBLE: '*'
        run: |
          set -e
          out_dir="dist/blamely_${{ steps.tag.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          bin_name="blamely${{ matrix.ext }}"
          mkdir -p "$out_dir"
          # garble flags:
          #   -literals  encrypt string constants in the compiled binary
          #   -tiny      strip extra runtime metadata (no panic line numbers;
          #              combines well with -s -w)
          # Standard build flags still apply via the wrapped `go build`:
          #   -trimpath        remove build paths
          #   -buildvcs=false  don't stamp git metadata (private repo info)
          #   -ldflags -s -w   strip symbols + DWARF
          #   -X main.version  pin the version string to the release tag
          garble -literals -tiny build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ steps.tag.outputs.tag }}" \
            -o "$out_dir/$bin_name" \
            ./cmd/blamely

      - name: Verify obfuscation
        # Smoke check: a binary built with `garble -literals` should NOT
        # contain readable internal Go symbols like our package paths.
        # We grep for our import path and fail the job if it shows up — that
        # would mean the obfuscation regressed.
        # `grep -a` treats the binary as text; portable across all runners.
        shell: bash
        run: |
          set -e
          bin="dist/blamely_${{ steps.tag.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}/blamely${{ matrix.ext }}"
          if grep -a -q "github.com/blamely/blamely/internal" "$bin"; then
            echo "ERROR: internal import paths still visible in $bin"
            exit 1
          fi
          echo "OK: $bin is obfuscated"

      - name: Package archive
        id: pkg
        shell: bash
        run: |
          set -e
          dir="dist/blamely_${{ steps.tag.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          case "${{ matrix.goos }}" in
            windows)
              # `zip` isn't shipped with Git Bash on windows-latest runners.
              # `7z` is preinstalled and produces a standard .zip when invoked
              # with `a -tzip`. -bd silences progress; -mx=9 = max deflate.
              archive="${dir}.zip"
              (cd dist && 7z a -tzip -mx=9 -bd "$(basename "$archive")" "$(basename "$dir")" >/dev/null)
              ;;
            *)
              archive="${dir}.tar.gz"
              tar -czf "$archive" -C dist "$(basename "$dir")"
              ;;
          esac
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  # ── 2. Aggregate + publish to the public release repo ──────────────────────
  publish:
    name: publish to release repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -e
          shopt -s nullglob
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to public release repo
        # gh CLI is preinstalled on ubuntu-latest. We use the PAT so the
        # release lands in a DIFFERENT repo than the one running this workflow.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        working-directory: dist
        run: |
          set -e
          if [ -z "$GH_TOKEN" ] || [ -z "$RELEASE_REPO" ]; then
            echo "Missing required secrets: RELEASE_REPO and/or RELEASE_REPO_TOKEN."
            exit 1
          fi
          # Create the release (or reuse if it already exists). --target main
          # works because the release repo is public and gh will fetch the
          # default branch from the remote if --target isn't a known ref locally.
          gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "blamely $TAG" \
              --generate-notes \
              --verify-tag=false
          # Upload (or replace) every versioned archive plus SHA256SUMS.
          gh release upload "$TAG" --repo "$RELEASE_REPO" --clobber \
            *.tar.gz *.zip SHA256SUMS

          # Mark the semver release as GitHub's default "Latest" (UI + /releases/latest).
          gh release edit "$TAG" --repo "$RELEASE_REPO" --latest

          # Rolling `latest` tag release — stable asset names for curl|bash installers.
          mkdir -p latest-assets
          shopt -s nullglob
          for f in blamely_"${TAG}"_*.tar.gz blamely_"${TAG}"_*.zip; do
            [ -f "$f" ] || continue
            stable="blamely_${f#blamely_${TAG}_}"
            cp "$f" "latest-assets/${stable}"
          done
          (cd latest-assets && sha256sum *.tar.gz *.zip > SHA256SUMS 2>/dev/null || true)

          gh release view latest --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$RELEASE_REPO" \
              --title "Latest" \
              --notes "Rolling build from the most recent release. Pin a version with a \`v*.*.*\` tag instead." \
              --verify-tag=false

          gh release upload latest --repo "$RELEASE_REPO" --clobber latest-assets/*
