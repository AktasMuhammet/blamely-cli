name: Build & Publish Release

# Cross-OS build, then publish the resulting binaries as a release on a
# SEPARATE PUBLIC repository (this source repo is private).
#
# How it triggers:
#   - Push a tag of the form `vX.Y.Z` to this private source repo.
#   - Or kick off manually via the "Run workflow" button (workflow_dispatch).
#
# Required secrets in this private source repo:
#   RELEASE_REPO        e.g. `blamely/blamely`           (owner/repo of the PUBLIC release repo)
#   RELEASE_REPO_TOKEN  a fine-grained PAT with `contents: write` on RELEASE_REPO
#                       (default GITHUB_TOKEN can't reach other repos)
#
# Optional secrets:
#   BLAMELY_SIGN_PFX_BASE64 / BLAMELY_SIGN_PASS  → Authenticode-sign the Windows
#     blamely.exe AND the setup.exe installer (absent → published unsigned)
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE             → detach-sign SHA256SUMS
#
# Artifacts published per semver tag (e.g. v0.2.0):
#   blamely_<tag>_darwin_amd64.tar.gz
#   blamely_<tag>_darwin_arm64.tar.gz
#   blamely_<tag>_linux_amd64.tar.gz
#   blamely_<tag>_linux_arm64.tar.gz
#   blamely_<tag>_windows_amd64.zip
#   blamely_<tag>_windows_arm64.zip
#   SHA256SUMS  (over every versioned archive)
#
# A rolling `latest` release is also updated (stable filenames for installers):
#   blamely_darwin_amd64.tar.gz
#   blamely_darwin_arm64.tar.gz
#   blamely_linux_amd64.tar.gz
#   blamely_linux_arm64.tar.gz
#   blamely_windows_amd64.zip
#   blamely_windows_arm64.zip
#   → https://github.com/<RELEASE_REPO>/releases/download/latest/<asset>

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Required when running manually.'
        required: true
        type: string

permissions:
  contents: read     # only need to read this source repo; release writes go via PAT

env:
  GO_VERSION: '1.26.4'

jobs:
  # ── 1. Build per OS/arch in parallel ───────────────────────────────────────
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64, runner: macos-latest,   ext: ''     }
          - { goos: darwin,  goarch: arm64, runner: macos-latest,   ext: ''     }
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest,  ext: ''     }
          - { goos: linux,   goarch: arm64, runner: ubuntu-latest,  ext: ''     }
          - { goos: windows, goarch: amd64, runner: windows-latest, ext: '.exe' }
          - { goos: windows, goarch: arm64, runner: windows-latest, ext: '.exe' }
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          # Use the pushed tag, or the manual input. Strip refs/tags/ if present.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        run: go test ./...

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'      # static binary; SQLite uses modernc.org/sqlite (pure Go)
        run: |
          set -e
          out_dir="dist/blamely_${{ steps.tag.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          bin_name="blamely${{ matrix.ext }}"
          mkdir -p "$out_dir"
          # Standard release build flags:
          #   -trimpath        remove build paths
          #   -buildvcs=false  don't stamp git metadata
          #   -ldflags -s -w   strip symbols + DWARF
          #   -X main.version  pin the version string to the release tag
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ steps.tag.outputs.tag }}" \
            -o "$out_dir/$bin_name" \
            ./cmd/blamely

      - name: Smoke-test binary (native arch only)
        # Run the just-built binary on the matching-arch runner:
        #   - `--version` proves it executes AND the `-X main.version` ldflag
        #     was applied (else it prints the dev default).
        #   - `history --all` opens, migrates, and queries ~/.blamely/db.sqlite,
        #     exercising the SQLite stack; it needs no git repo / daemon /
        #     network and exits 0 on an empty DB.
        # Cross-arch builds (e.g. linux/arm64 on an amd64 runner) can't run
        # here, so this is gated to the native OS/arch of each runner.
        if: >-
          (matrix.goos == 'darwin' && matrix.goarch == 'arm64') ||
          (matrix.goos == 'linux' && matrix.goarch == 'amd64') ||
          (matrix.goos == 'windows' && matrix.goarch == 'amd64')
        shell: bash
        run: |
          set -e
          tag="${{ steps.tag.outputs.tag }}"
          bin="dist/blamely_${tag}_${{ matrix.goos }}_${{ matrix.goarch }}/blamely${{ matrix.ext }}"
          ver="$("$bin" --version)"
          echo "version output: $ver"
          case "$ver" in
            *"$tag"*) echo "OK: binary runs and the version ldflag was applied" ;;
            *) echo "ERROR: version output '$ver' does not contain tag '$tag' — -X mapping broke"; exit 1 ;;
          esac
          # Open + migrate + query the SQLite store (the modernc stack).
          "$bin" history --all
          echo "OK: binary runs and SQLite works"

      - name: Package archive
        id: pkg
        shell: bash
        run: |
          set -e
          dir="dist/blamely_${{ steps.tag.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          case "${{ matrix.goos }}" in
            windows)
              # `zip` isn't shipped with Git Bash on windows-latest runners.
              # `7z` is preinstalled and produces a standard .zip when invoked
              # with `a -tzip`. -bd silences progress; -mx=9 = max deflate.
              archive="${dir}.zip"
              (cd dist && 7z a -tzip -mx=9 -bd "$(basename "$archive")" "$(basename "$dir")" >/dev/null)
              ;;
            *)
              archive="${dir}.tar.gz"
              tar -czf "$archive" -C dist "$(basename "$dir")"
              ;;
          esac
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  # ── 2. Windows installer (Inno Setup .exe, Authenticode-signed) ────────────
  # Builds a double-clickable setup.exe from the Windows release archive so users
  # avoid the irm|iex script (which corporate EDR/SmartScreen flags). Signed with
  # the code-signing cert in the BLAMELY_SIGN_* secrets; absent secrets → an
  # UNSIGNED installer + a warning, never a failed release.
  installers:
    name: installer windows/${{ matrix.arch }}
    needs: build
    runs-on: windows-latest
    # Signing secret exposed as job env so the step `if:` presence-check can read
    # it (step-level env is not visible to that step's own `if`). Optional.
    env:
      PFX: ${{ secrets.BLAMELY_SIGN_PFX_BASE64 }}
      PFX_PASS: ${{ secrets.BLAMELY_SIGN_PASS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   goarch: amd64 }
          - { arch: arm64, goarch: arm64 }
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then tag="${{ github.event.inputs.tag }}";
          else tag="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"   # version without leading v

      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          pattern: blamely_${{ steps.tag.outputs.tag }}_windows_${{ matrix.goarch }}.*
          path: incoming
          merge-multiple: true

      - name: Extract binary
        id: bin
        shell: bash
        run: |
          set -e
          dir="blamely_${{ steps.tag.outputs.tag }}_windows_${{ matrix.goarch }}"
          mkdir -p work
          7z x -y "incoming/${dir}.zip" -owork >/dev/null || unzip -q -o "incoming/${dir}.zip" -d work
          bin="work/${dir}/blamely.exe"
          [ -f "$bin" ] || { echo "binary missing: $bin"; ls -R work; exit 1; }
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      # Sign the binary BEFORE it's packaged, so the .exe inside the installer is
      # also signed (Defender scans the extracted exe, not just the installer).
      - name: Sign blamely.exe (Authenticode)
        if: env.PFX != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $pass = if ($env:PFX_PASS) { @('/p', $env:PFX_PASS) } else { @() }
          & signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            /f $pfx @pass "${{ steps.bin.outputs.path }}"

      - name: Build Windows installer
        shell: pwsh
        env:
          SQLITE_WIN_URL: 'https://www.sqlite.org/2025/sqlite-tools-win-x64-3500400.zip'
        run: |
          choco install innosetup --no-progress -y
          # sqlite3.exe: the IDE plugins' DB reader, which Windows lacks. Fetch it
          # so the installer can drop it into ~/.blamely/bin (same source the
          # publish job uses). Only the x64 build exists upstream; arm64 runs it
          # under emulation, so bundle the x64 exe for both.
          Invoke-WebRequest -Uri $env:SQLITE_WIN_URL -OutFile sqlite-tools.zip
          Expand-Archive -Force sqlite-tools.zip sqlite-tools
          $sqlite = (Get-ChildItem -Recurse sqlite-tools -Filter sqlite3.exe | Select-Object -First 1).FullName
          $src = Split-Path "${{ steps.bin.outputs.path }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.tag.outputs.ver }}" "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=$src" "/DSqlite=$sqlite" `
            "/Oout" "/Fblamely_${{ steps.tag.outputs.tag }}_windows_${{ matrix.arch }}_setup" `
            packaging\windows\blamely.iss

      - name: Sign Windows installer (Authenticode)
        if: env.PFX != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          $pass = if ($env:PFX_PASS) { @('/p', $env:PFX_PASS) } else { @() }
          & signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            /f $pfx @pass (Get-ChildItem out\*setup*.exe).FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # ── 2b. macOS installer (.pkg wrapped in .dmg) ─────────────────────────────
  # Builds a native macOS installer from the darwin release archive. The .pkg's
  # postinstall runs `blamely install` AS THE LOGGED-IN USER (Blamely is per-user).
  # No Apple Developer ID → binary is only ad-hoc signed and the .pkg/.dmg are
  # un-notarized (Gatekeeper "right-click → Open"; see packaging/TRUST.md).
  installers-macos:
    name: installer macos/${{ matrix.arch }}
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then tag="${{ github.event.inputs.tag }}";
          else tag="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download macOS archive
        uses: actions/download-artifact@v4
        with:
          pattern: blamely_${{ steps.tag.outputs.tag }}_darwin_${{ matrix.arch }}.*
          path: incoming
          merge-multiple: true

      - name: Extract binary
        id: bin
        shell: bash
        run: |
          set -e
          dir="blamely_${{ steps.tag.outputs.tag }}_darwin_${{ matrix.arch }}"
          mkdir -p work
          tar -xzf "incoming/${dir}.tar.gz" -C work
          bin="work/${dir}/blamely"
          [ -f "$bin" ] || { echo "binary missing: $bin"; ls -R work; exit 1; }
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Build macOS installer (.pkg + .dmg)
        shell: bash
        run: |
          ./packaging/macos/build-macos.sh \
            --version "${{ steps.tag.outputs.ver }}" \
            --arch "${{ matrix.arch }}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --binary "${{ steps.bin.outputs.path }}" \
            --out out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # ── 2c. Linux installers (.deb + .rpm via nfpm, and .AppImage) ─────────────
  # Builds native Linux packages from the linux release archive. The .deb/.rpm
  # postinstall runs `blamely install` AS THE DESKTOP USER; their output streams
  # to the terminal during `apt`/`dnf install`. The AppImage is a portable runner
  # (does NOT auto-wire hooks). No OS gatekeeper → trust is via GPG-signed
  # SHA256SUMS (produced in the publish job).
  installers-linux:
    name: installer linux/${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    env:
      # appimagetool is itself an AppImage; runners lack FUSE, so extract-and-run.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then tag="${{ github.event.inputs.tag }}";
          else tag="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download Linux archive
        uses: actions/download-artifact@v4
        with:
          pattern: blamely_${{ steps.tag.outputs.tag }}_linux_${{ matrix.arch }}.*
          path: incoming
          merge-multiple: true

      - name: Extract binary
        id: bin
        shell: bash
        run: |
          set -e
          dir="blamely_${{ steps.tag.outputs.tag }}_linux_${{ matrix.arch }}"
          mkdir -p work
          tar -xzf "incoming/${dir}.tar.gz" -C work
          bin="work/${dir}/blamely"
          [ -f "$bin" ] || { echo "binary missing: $bin"; ls -R work; exit 1; }
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Install packagers (nfpm + appimagetool)
        shell: bash
        run: |
          set -e
          # nfpm — one config → both .deb and .rpm. Official goreleaser apt repo.
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y nfpm
          # appimagetool (the host runner is x86_64; it fetches the target runtime).
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build .deb + .rpm
        shell: bash
        run: |
          ./packaging/linux/build-linux.sh \
            --version "${{ steps.tag.outputs.ver }}" \
            --arch "${{ matrix.arch }}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --binary "${{ steps.bin.outputs.path }}" \
            --out out

      - name: Build .AppImage
        shell: bash
        run: |
          ./packaging/linux/appimage/build-appimage.sh \
            --arch "${{ matrix.arch }}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --binary "${{ steps.bin.outputs.path }}" \
            --out out

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # ── 3. Aggregate + publish to the public release repo ──────────────────────
  publish:
    name: publish to release repo
    needs: [build, installers, installers-macos, installers-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        # Repo context for the publish job (workflow scripts / metadata).
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Fetch sqlite3.exe (Windows, for the editor plugins)
        # The VS Code / JetBrains plugins read the attribution DB through the
        # sqlite3 CLI, which Windows lacks. Ship it as a release asset so the
        # Windows installer can drop it into ~/.blamely/bin — the plugins' first,
        # PATH-independent lookup (a GUI-launched VS Code can't see PATH-installed
        # tools, which surfaces as "spawn sqlite3 ENOENT"). Pin via SQLITE_WIN_URL.
        shell: bash
        working-directory: dist
        env:
          SQLITE_WIN_URL: 'https://www.sqlite.org/2025/sqlite-tools-win-x64-3500400.zip'
        run: |
          set -e
          curl -fsSL "$SQLITE_WIN_URL" -o sqlite-tools.zip
          unzip -q -o sqlite-tools.zip -d sqlite-tools
          cp "$(find sqlite-tools -name sqlite3.exe -type f | head -1)" sqlite3.exe
          rm -rf sqlite-tools sqlite-tools.zip
          ls -la sqlite3.exe

      - name: Sign Windows binaries (Authenticode)
        # Authenticode-sign the Windows blamely.exe so Windows Defender /
        # SmartScreen trust it — an unsigned binary is what trips the
        # Trojan:Win32/Gracing (Wacatac/Sabsik) false positives.
        # osslsigncode signs PE files on a Linux host (signtool is Windows-only),
        # so we sign here in the publish job rather than on the build runners.
        #
        # Signs the .exe INSIDE each Windows .zip and re-packs it, and runs BEFORE
        # the SHA256SUMS step below so the published checksums cover the SIGNED
        # artifact. No-ops with a loud warning when no signing cert is configured,
        # so a release without the secret still publishes (just unsigned) — mirrors
        # the repo's sign-windows.sh behavior.
        #
        # Secrets (in this private source repo):
        #   BLAMELY_SIGN_PFX_BASE64  base64 of a .pfx/.p12 code-signing cert
        #   BLAMELY_SIGN_PASS        the .pfx password (empty for a passwordless cert)
        env:
          BLAMELY_SIGN_PFX_BASE64: ${{ secrets.BLAMELY_SIGN_PFX_BASE64 }}
          BLAMELY_SIGN_PASS: ${{ secrets.BLAMELY_SIGN_PASS }}
          BLAMELY_SIGN_TIMESTAMP_URL: 'http://timestamp.digicert.com'
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *_windows_*.zip )
          if [ -z "${BLAMELY_SIGN_PFX_BASE64:-}" ]; then
            echo "::warning::No BLAMELY_SIGN_PFX_BASE64 secret — shipping Windows binaries UNSIGNED (Defender may flag them)."
            exit 0
          fi
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No Windows archives found — nothing to sign."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y osslsigncode

          # Materialize the .pfx from the base64 secret into a temp file.
          pfx="$(mktemp)"
          trap 'rm -f "$pfx"' EXIT
          printf '%s' "$BLAMELY_SIGN_PFX_BASE64" | base64 -d > "$pfx" \
            || { echo "::error::BLAMELY_SIGN_PFX_BASE64 is not valid base64"; exit 1; }
          # Omit -pass entirely for a passwordless cert (osslsigncode dislikes -pass "").
          passargs=()
          [ -n "${BLAMELY_SIGN_PASS:-}" ] && passargs=(-pass "$BLAMELY_SIGN_PASS")

          for zip in "${zips[@]}"; do
            dir="${zip%.zip}"                       # e.g. blamely_v1.7.0_windows_amd64
            rm -rf _sign && mkdir _sign
            unzip -q -o "$zip" -d _sign
            exe="_sign/$dir/blamely.exe"
            [ -f "$exe" ] || { echo "::error::$exe not found inside $zip"; exit 1; }
            # -h sha256 + -ts (RFC3161) is the modern Authenticode profile; the
            # timestamp keeps the signature valid after the cert expires.
            osslsigncode sign \
              -pkcs12 "$pfx" "${passargs[@]}" \
              -n "Blamely" -i "https://blamely.ai" \
              -h sha256 -ts "$BLAMELY_SIGN_TIMESTAMP_URL" \
              -in "$exe" -out "$exe.signed"
            mv -f "$exe.signed" "$exe"
            # Re-pack with the same top-level layout the build job produced.
            rm -f "$zip"
            ( cd _sign && zip -q -r -X "../$zip" "$dir" )
            rm -rf _sign
            echo "✓ signed and repacked $zip"
          done

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -e
          shopt -s nullglob
          # Covers the archives, the Windows plugin sqlite3.exe, the signed Windows
          # setup.exe, AND the native macOS/Linux installers (.pkg .dmg .deb .rpm
          # .AppImage) built by the installer jobs.
          sha256sum *.tar.gz *.zip *_setup.exe *.pkg *.dmg *.deb *.rpm *.AppImage sqlite3.exe \
            > SHA256SUMS
          cat SHA256SUMS

      - name: GPG-sign checksums
        # Linux binaries have no OS-level code signature; instead we detach-sign
        # the SHA256SUMS manifest so users can verify both integrity (sha) AND
        # authenticity (our GPG key). The same .asc covers every platform's
        # archive, since SHA256SUMS lists them all.
        #   Verify:  gpg --verify SHA256SUMS.asc SHA256SUMS
        #            sha256sum -c SHA256SUMS
        # Secrets (in this private source repo):
        #   GPG_PRIVATE_KEY  ASCII-armored private key (gpg --armor --export-secret-keys KEYID)
        #   GPG_PASSPHRASE   passphrase for that key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        working-directory: dist
        run: |
          set -e
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "Missing GPG_PRIVATE_KEY and/or GPG_PASSPHRASE secrets."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor -o SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Export public trust assets (cert + GPG pubkey)
        # With only a self-signed cert (no CA / Azure / Apple ID), trust is a
        # documented, verifiable process rather than a silent OS prompt. Publish
        # the PUBLIC verification material so a security team can audit and an
        # admin can whitelist — never the private .pfx/.key:
        #   blamely-codesign.crt   public half of the code-signing cert (from the
        #                          PFX secret; extracted with openssl, no key)
        #   blamely-gpg-public.asc public GPG key that signs SHA256SUMS.asc
        env:
          BLAMELY_SIGN_PFX_BASE64: ${{ secrets.BLAMELY_SIGN_PFX_BASE64 }}
          BLAMELY_SIGN_PASS: ${{ secrets.BLAMELY_SIGN_PASS }}
        shell: bash
        working-directory: dist
        run: |
          set -e
          # Export the public GPG key (private key already imported above).
          gpg --armor --export > blamely-gpg-public.asc || true
          [ -s blamely-gpg-public.asc ] || rm -f blamely-gpg-public.asc
          # Extract the PUBLIC cert from the PFX secret — public half only, no key.
          if [ -n "${BLAMELY_SIGN_PFX_BASE64:-}" ]; then
            pfx="$(mktemp)"; trap 'rm -f "$pfx"' EXIT
            printf '%s' "$BLAMELY_SIGN_PFX_BASE64" | base64 -d > "$pfx"
            passin=()
            [ -n "${BLAMELY_SIGN_PASS:-}" ] && passin=(-passin "pass:${BLAMELY_SIGN_PASS}")
            [ ${#passin[@]} -eq 0 ] && passin=(-passin pass:)
            # -legacy: OpenSSL 3 needs it for the RC2-encrypted PFXs signtool makes.
            openssl pkcs12 -in "$pfx" -clcerts -nokeys "${passin[@]}" -legacy \
              -out blamely-codesign.crt 2>/dev/null \
              || openssl pkcs12 -in "$pfx" -clcerts -nokeys "${passin[@]}" \
                   -out blamely-codesign.crt 2>/dev/null \
              || echo "::warning::could not extract public cert from PFX"
            [ -s blamely-codesign.crt ] || rm -f blamely-codesign.crt
          else
            echo "::warning::No BLAMELY_SIGN_PFX_BASE64 — skipping public cert asset."
          fi
          ls -la blamely-gpg-public.asc blamely-codesign.crt 2>/dev/null || true

      - name: Publish to public release repo
        # gh CLI is preinstalled on ubuntu-latest. We use the PAT so the
        # release lands in a DIFFERENT repo than the one running this workflow.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        working-directory: dist
        run: |
          set -e
          if [ -z "$GH_TOKEN" ] || [ -z "$RELEASE_REPO" ]; then
            echo "Missing required secrets: RELEASE_REPO and/or RELEASE_REPO_TOKEN."
            exit 1
          fi
          # Create the release (or reuse if it already exists). --target main
          # works because the release repo is public and gh will fetch the
          # default branch from the remote if --target isn't a known ref locally.
          gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "blamely $TAG" \
              --generate-notes \
              --verify-tag=false
          # Upload (or replace) every versioned archive, the signed Windows
          # setup.exe, the native macOS/Linux installers (.pkg .dmg .deb .rpm
          # .AppImage), sqlite3.exe (Windows plugin dependency), SHA256SUMS + its
          # signature, and the public trust assets (cert, GPG pubkey).
          shopt -s nullglob
          gh release upload "$TAG" --repo "$RELEASE_REPO" --clobber \
            *.tar.gz *.zip *_setup.exe *.pkg *.dmg *.deb *.rpm *.AppImage \
            sqlite3.exe SHA256SUMS SHA256SUMS.asc \
            blamely-gpg-public.asc blamely-codesign.crt

          # Mark the semver release as GitHub's default "Latest" (UI + /releases/latest).
          gh release edit "$TAG" --repo "$RELEASE_REPO" --latest

          # Rolling `latest` tag release — stable asset names for the installers
          # and curl|bash scripts (archives + Windows setup.exe get the tag
          # stripped so download URLs are version-independent).
          mkdir -p latest-assets
          shopt -s nullglob
          for f in blamely_"${TAG}"_*.tar.gz blamely_"${TAG}"_*.zip \
                   blamely_"${TAG}"_*_setup.exe \
                   blamely_"${TAG}"_*.pkg blamely_"${TAG}"_*.dmg \
                   blamely_"${TAG}"_*.deb blamely_"${TAG}"_*.rpm \
                   blamely_"${TAG}"_*.AppImage; do
            [ -f "$f" ] || continue
            stable="blamely_${f#blamely_${TAG}_}"
            cp "$f" "latest-assets/${stable}"
          done
          # sqlite3.exe + trust assets already have stable (version-less) names.
          cp sqlite3.exe latest-assets/sqlite3.exe
          for extra in blamely-gpg-public.asc blamely-codesign.crt; do
            [ -f "$extra" ] && cp "$extra" "latest-assets/$extra"
          done
          (cd latest-assets && sha256sum *.tar.gz *.zip *_setup.exe *.pkg *.dmg *.deb *.rpm *.AppImage sqlite3.exe > SHA256SUMS 2>/dev/null || true)
          # Sign the rolling manifest too (GPG key already imported above).
          if [ -f latest-assets/SHA256SUMS ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o latest-assets/SHA256SUMS.asc latest-assets/SHA256SUMS
          fi

          gh release view latest --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$RELEASE_REPO" \
              --title "Latest" \
              --notes "Rolling build from the most recent release. Pin a version with a \`v*.*.*\` tag instead." \
              --verify-tag=false

          gh release upload latest --repo "$RELEASE_REPO" --clobber latest-assets/*
